<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hold the Deck</title>
    <!-- Installing (the manifest link is added by vite-plugin-pwa). -->
    <meta name="theme-color" content="#2a1e4a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hold the Deck" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
    <style>
      /* Background: DISPLAY.bars.color (set again from config by display.js). */
      html, body { margin: 0; height: 100%; overflow: hidden; background: #141a30; }
      #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      /* Settings' Export / Import save box (src/ui/SaveCodeDialog.js), over
         the parchment. */
      .save-code {
        position: fixed; box-sizing: border-box; margin: 0; padding: 4px; resize: none;
        font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace; word-break: break-all;
        color: #2a1a10; background: #fff3d6; border: 2px solid #8a5a2e; border-radius: 0;
        user-select: text; -webkit-user-select: text; touch-action: auto;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
