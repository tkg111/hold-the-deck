<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No zooming (pinch or double-tap); viewport-fit=cover draws the game
         under a notch or camera (the HUD keeps clear: #safe-probe). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Hold the Deck</title>
    <!-- Installing (the manifest link is added by vite-plugin-pwa). -->
    <meta name="theme-color" content="#2a1e4a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hold the Deck" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
    <style>
      /* Background: DISPLAY.barColor (set again from config by display.js).
         The page never scrolls, bounces, pulls to refresh, zooms, selects
         text or shows the long-press callout. */
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #141a30;
        position: fixed; inset: 0;
        overscroll-behavior: none; touch-action: none;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
      }
      /* The game fills the window, edge to edge (display.js sizes the
         canvas; only a window taller than 4:3 leaves bars above and below). */
      #game {
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
      }
      /* The safe area round notches, cameras and the home bar, read by
         display.js from this hidden box's padding: the browser's
         env(safe-area-inset-*), or the Android app's own cutout insets
         (--native-inset-*, set by MainActivity) where those are bigger. */
      #safe-probe {
        position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
        padding: max(env(safe-area-inset-top, 0px), var(--native-inset-top, 0px))
          max(env(safe-area-inset-right, 0px), var(--native-inset-right, 0px))
          max(env(safe-area-inset-bottom, 0px), var(--native-inset-bottom, 0px))
          max(env(safe-area-inset-left, 0px), var(--native-inset-left, 0px));
      }
      #game canvas { touch-action: none; }
      /* Settings' Export / Import save box (src/ui/SaveCodeDialog.js), over
         the parchment. */
      .save-code {
        position: fixed; box-sizing: border-box; margin: 0; padding: 4px; resize: none;
        font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace; word-break: break-all;
        color: #2a1a10; background: #fff3d6; border: 2px solid #8a5a2e; border-radius: 0;
        user-select: text; -webkit-user-select: text; -webkit-touch-callout: default; touch-action: auto;
      }
      /* One-line text fields over the canvas (src/ui/HtmlField.js): the
         Rankings' captain name and friend's code. */
      .game-field {
        position: fixed; box-sizing: border-box; margin: 0; padding: 0 6px; outline: none;
        font: bold 13px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 1px;
        color: #2a1a10; background: #fbf1d8; border: 2px solid #c9a46a; border-radius: 0;
        user-select: text; -webkit-user-select: text; -webkit-touch-callout: default; touch-action: auto;
      }
      .game-field:focus { border-color: #8a5a2e; }
      .game-field::placeholder { color: #a8875e; letter-spacing: 2px; }
      /* "Turn your phone sideways" (src/phone.js): a touch phone held
         upright, with the game paused behind. */
      #rotate {
        position: fixed; inset: 0; z-index: 10; box-sizing: border-box; padding: 24px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        background: #2a1e4a; color: #fff3d6; text-align: center;
        font: bold 20px/1.3 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 1px;
      }
      #rotate[hidden] { display: none; }
      #rotate img { image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="safe-probe"></div>
    <div id="rotate" hidden>
      <img alt="" />
      <div>Turn your phone sideways</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
